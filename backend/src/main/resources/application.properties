# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/ecsite
spring.datasource.username=postgres
spring.datasource.password=postgres

# テーブルは Flyway で作る。開発用はサンプルデータ（db/sample）も読み込む
spring.flyway.locations=classpath:db/migration,classpath:db/sample
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jackson.time-zone=Asia/Tokyo

server.port=8080

logging.level.org.springframework=INFO
logging.level.com.example.ecsite=DEBUG
